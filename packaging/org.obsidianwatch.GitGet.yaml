app-id: org.obsidianwatch.GitGet
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: gitget

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-config/gitget
  - --filesystem=xdg-data/gitget
  - --filesystem=xdg-cache/gitget
  - --env=QT_QPA_PLATFORMTHEME=

modules:
  - name: gitget
    buildsystem: simple
    sources:
      - type: file
        path: ../dist/gitget
      - type: file
        path: gitget.desktop
      - type: file
        path: icons/gitget-256.png
        dest-filename: gitget.png
      - type: file
        path: ../src/gitget/assets/gitget.svg
    build-commands:
      - install -Dm755 gitget /app/bin/gitget
      - install -Dm644 gitget.desktop /app/share/applications/org.obsidianwatch.GitGet.desktop
      - install -Dm644 gitget.png /app/share/icons/hicolor/256x256/apps/org.obsidianwatch.GitGet.png
      - install -Dm644 gitget.svg /app/share/icons/hicolor/scalable/apps/org.obsidianwatch.GitGet.svg
